[build]
  command = "cp prisma/schema.production.prisma prisma/schema.prisma && npx prisma generate && DATABASE_URL=${DIRECT_URL} npx prisma migrate deploy && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"
