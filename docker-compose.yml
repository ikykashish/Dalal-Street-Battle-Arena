services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dalal_street_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a PostgreSQL URL using host postgres}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in .env}
      SEED_SECRET: ${SEED_SECRET:?Set SEED_SECRET in .env}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    profiles: [maintenance]
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a PostgreSQL URL using host postgres}
    command: ["npx", "prisma", "migrate", "deploy", "--schema=prisma/schema.production.prisma"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    profiles: [maintenance]
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a PostgreSQL URL using host postgres}
    command: ["node", ".server/prisma/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: [public]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
